[package]
name = "icp-rhai-plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "An icp-cli sync plugin that runs a Rhai script against the canister being synced"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
candid_parser = "0.4"
hex = "0.4"
rhai = { version = "1.25", features = ["serde"] }
rhai-fs = "0.1.5"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.56", features = ["realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
